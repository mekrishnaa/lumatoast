<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumaToast Playground</title>
    <link rel="icon" type="image/jpeg" href="./logo.jpg" />

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0d0f14;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 24px 24px 80px;
        }

        /* Header */
        .pg-header {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .pg-header-row {
            display: inline-flex;
            align-items: center;
            gap: 16px;
        }

        .pg-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25), 0 6px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin: 0;
            object-fit: cover;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .pg-logo:hover {
            transform: scale(1.08) rotate(-2deg);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.4), 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .pg-header-text {
            text-align: left;
        }

        .pg-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
        }

        .pg-header p {
            color: #64748b;
            font-size: 13px;
        }

        /* Layout */
        .pg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Section card */
        .pg-section {
            background: #131720;
            border: 1px solid #1e2433;
            border-radius: 16px;
            padding: 20px;
        }

        .pg-section h2 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #475569;
            margin-bottom: 16px;
        }

        /* Button grid */
        .pg-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* Playground button base */
        .pg-btn {
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid #1e2433;
            background: #1a1f2e;
            color: #cbd5e1;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
            white-space: nowrap;
        }

        .pg-btn:hover {
            background: #232a3b;
            border-color: #2e3a52;
            color: #f1f5f9;
        }

        /* Colour accents */
        .pg-btn.success { border-color: #166534; color: #4ade80; }
        .pg-btn.success:hover { background: #14532d22; border-color: #22c55e; }

        .pg-btn.error { border-color: #7f1d1d; color: #f87171; }
        .pg-btn.error:hover { background: #7f1d1d22; border-color: #ef4444; }

        .pg-btn.warning { border-color: #78350f; color: #fbbf24; }
        .pg-btn.warning:hover { background: #78350f22; border-color: #f59e0b; }

        .pg-btn.info { border-color: #1e3a5f; color: #60a5fa; }
        .pg-btn.info:hover { background: #1e3a5f22; border-color: #3b82f6; }

        .pg-btn.loading { border-color: #374151; color: #9ca3af; }
        .pg-btn.loading:hover { background: #37415122; border-color: #6b7280; }

        .pg-btn.purple { border-color: #4c1d95; color: #a78bfa; }
        .pg-btn.purple:hover { background: #4c1d9522; border-color: #8b5cf6; }

        .pg-btn.danger {
            background: #7f1d1d22;
            border-color: #ef4444;
            color: #f87171;
        }
        .pg-btn.danger:hover { background: #7f1d1d44; }

        /* Active state indicator */
        .pg-btn.active {
            background: #1d3a5f;
            border-color: #3b82f6;
            color: #93c5fd;
        }

        /* Select / label row */
        .pg-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pg-label {
            font-size: 12px;
            color: #64748b;
            min-width: 60px;
        }

        select.pg-select {
            font-family: inherit;
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #1e2433;
            background: #1a1f2e;
            color: #cbd5e1;
            cursor: pointer;
            outline: none;
        }

        select.pg-select:focus { border-color: #3b82f6; }

        /* Active state badge */
        .pg-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 99px;
            background: #1d3a5f;
            color: #60a5fa;
            border: 1px solid #2563eb44;
        }

        /* Divider */
        .pg-divider {
            height: 1px;
            background: #1e2433;
            margin: 12px 0;
        }

        /* Status bar */
        #pg-status {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: #131720;
            border: 1px solid #1e2433;
            border-radius: 99px;
            padding: 8px 20px;
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="pg-header">
        <div class="pg-header-row">
            <img class="pg-logo" src="./logo.jpg" alt="LumaToast Icon" />
            <div class="pg-header-text">
                <h1>LumaToast</h1>
                <p>Interactive feature playground — test every option live</p>
            </div>
        </div>
    </div>

    <div class="pg-grid" id="pg-root"></div>

    <div id="pg-status">Global: theme=linear · position=top-right · speed=normal</div>

    <script type="module" src="./main.ts"></script>
</body>

</html>
